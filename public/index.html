<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>별이 내리는 카페</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background: #151c30;
      color: #fff5df;
      font: 15px system-ui;
    }

    canvas {
      display: block;
    }

    #ui,
    #nav {
      position: fixed;
      z-index: 1;
      padding: 12px;
      background: #231b1be8;
      border-radius: 12px;
      box-sizing: border-box;
    }

    #ui {
      top: 8px;
      left: 8px;
      max-width: calc(100% - 16px);
      overflow-wrap: anywhere;
    }

    button {
      padding: 8px;
      margin: 2px;
      background: #684635;
      color: #fff5df;
      border: 1px solid #a5815e;
      border-radius: 6px;
    }

    button:disabled {
      opacity: .45;
    }

    #msg {
      margin: 6px 0;
    }

    small {
      display: block;
    }

    #nav {
      display: grid !important;
      visibility: visible !important;
      opacity: 1 !important;
      position: fixed !important;
      z-index: 10000 !important;

      left: 12px;
      bottom: 12px;

      grid-template-columns: repeat(3, 46px);
      gap: 5px;
      padding: 6px;

      width: max-content;
      max-width: none;
      transform: none !important;
      pointer-events: auto !important;
      touch-action: none;
    }

    #nav > button {
      display: block !important;
      box-sizing: border-box;
      width: 46px;
      height: 46px;
      margin: 0;
      padding: 0;
      font-size: 22px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (any-pointer: coarse), (max-width: 900px) {
      #nav {
        grid-template-columns: repeat(3, 48px) !important;
        grid-template-rows: repeat(2, 48px) !important;
        gap: 5px !important;
        padding: 6px !important;
      }

      #nav > button {
        width: 48px !important;
        height: 48px !important;
        font-size: 23px !important;
      }

      #ui {
        padding: 8px;
        font-size: 13px;
        line-height: 1.35;
      }

      #ui small {
        font-size: 11px;
      }

      #ui button {
        min-height: 36px;
        font-size: 12px;
      }
    }

    @media (max-height: 450px) and (orientation: landscape) {
      #nav {
        grid-template-columns: repeat(3, 44px) !important;
        grid-template-rows: repeat(2, 44px) !important;
        gap: 4px !important;
        padding: 5px !important;
      }

      #nav > button {
        width: 44px !important;
        height: 44px !important;
        font-size: 21px !important;
      }

      #ui {
        max-width: min(420px, calc(100% - 16px));
        padding: 6px 8px;
        font-size: 12px;
      }

      #ui small {
        display: none;
      }

      #ui button {
        min-height: 32px;
        padding: 5px 7px;
        font-size: 12px;
      }

      #msg {
        margin: 3px 0;
      }
    }
  </style>
</head>

<body>
  <div id="ui">
    <b>별이 내리는 카페</b>
    <button id="share">친구 링크 복사</button>
    <small>
      WASD 이동 · Q/E 회전 · 화면 드래그로 둘러보기
    </small>
    <div id="msg"></div>
    <div id="act"></div>
  </div>

  <div id="nav"></div>

  <script>
    // 브라우저 주소창 등의 변화에 맞춰 버튼 위치를 다시 계산합니다.
    (() => {
      const nav = document.getElementById('nav');
      const viewport = window.visualViewport;
      let frame = 0;

      function placeControls() {
        frame = 0;

        const height = viewport
          ? viewport.height
          : window.innerHeight;

        const offsetTop = viewport ? viewport.offsetTop : 0;
        const offsetLeft = viewport ? viewport.offsetLeft : 0;

        const top = Math.max(
          offsetTop + 8,
          offsetTop + height - nav.offsetHeight - 12
        );

        // world.js의 기존 위치 지정과 충돌하지 않도록
        // 계산한 위치를 요소에 직접 적용합니다.
        nav.style.setProperty('top', top + 'px', 'important');
        nav.style.setProperty('bottom', 'auto', 'important');
        nav.style.setProperty(
          'left',
          'calc(' + (offsetLeft + 12) +
            'px + env(safe-area-inset-left, 0px))',
          'important'
        );
        nav.style.setProperty('right', 'auto', 'important');
        nav.style.setProperty('transform', 'none', 'important');
      }

      function schedulePlacement() {
        if (frame) return;
        frame = requestAnimationFrame(placeControls);
      }

      window.addEventListener('resize', schedulePlacement);
      window.addEventListener('orientationchange', schedulePlacement);
      window.addEventListener('load', schedulePlacement);

      if (viewport) {
        viewport.addEventListener('resize', schedulePlacement);
        viewport.addEventListener('scroll', schedulePlacement);
      }

      if ('ResizeObserver' in window) {
        new ResizeObserver(schedulePlacement).observe(nav);
      }

      schedulePlacement();
    })();
  </script>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/world.js?v=mobile4"></script>
</body>
</html>
